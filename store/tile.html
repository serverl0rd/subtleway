<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 440px; height: 280px; overflow: hidden; }
    body {
      font-family: "Netflix Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
      color: #fff; position: relative;
      background:
        radial-gradient(600px 300px at 25% 15%, rgba(229,9,20,0.30), transparent 60%),
        radial-gradient(500px 320px at 90% 95%, rgba(0,150,59,0.22), transparent 60%),
        linear-gradient(160deg, #1a1a1a, #000);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .brand { font-size: 44px; font-weight: 800; letter-spacing: -0.5px; }
    .brand .sub, .brand .way { font-family: "Trebuchet MS","Segoe UI",system-ui,sans-serif; font-weight: 800; }
    .brand .sub { color: #00963b; }
    .brand .way { color: #ffc600; }
    .brand .tle { color: #e50914; font-family: "Arial Narrow","Roboto Condensed",sans-serif; text-transform: lowercase; letter-spacing: 1px; }
    .tag { margin-top: 12px; font-size: 15px; color: #c9c9c9; }
    .caption {
      margin-top: 20px; font-size: 18px; color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
      background: rgba(0,0,0,0.45); padding: 4px 12px; border-radius: 4px;
    }
    .credit { position: absolute; bottom: 12px; font-size: 11px; color: #808080; }
    .credit b { color: #e50914; }
  </style>
</head>
<body>
  <div class="brand"><span class="sub">Sub</span><span class="tle">tle</span><span class="way">way</span></div>
  <div class="tag">Subtitles your way — Netflix &amp; Prime Video</div>
  <div class="caption">Colour · Font · Size · Position</div>
  <div class="credit">Free by <b>BuildCraft Labs</b></div>
</body>
</html>
